name: Catch RSS Articles

on:
  workflow_dispatch:
  repository_dispatch:
    types: [webhook]

permissions:
  contents: write

jobs:
  catch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Added requests, firebase-admin, dotenv, and beautifulsoup4 so rss_engine can run
        run: pip install feedparser requests firebase-admin python-dotenv beautifulsoup4

      - name: Build Firebase Credentials
        # Pulls your secure JSON from GitHub Secrets and temporarily writes it to the server
        env:
          FIREBASE_CREDS: ${{ secrets.FIREBASE_CREDENTIALS }}
        run: echo "$FIREBASE_CREDS" > firebase-credentials.json

      - name: Run catcher
        # Injects your specific database URL so rss_engine knows where to look
        env:
          FIREBASE_DB_URL: "https://rss-triage-default-rtdb.firebaseio.com"
        run: python cloud_catcher.py

      - name: Commit and push
        run: |
          git config user.name "Cloud Catcher Bot"
          git config user.email "bot@cloudcatcher"
          git add master_articles.json
          git diff --staged --quiet || git commit -m "Update articles $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
