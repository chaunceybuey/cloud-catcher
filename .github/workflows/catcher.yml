name: Catch RSS Articles

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  catch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser

      - name: Run catcher
        run: python cloud_catcher.py

      - name: Commit and push
        run: |
          git config user.name "Cloud Catcher Bot"
          git config user.email "bot@cloudcatcher"
          git add master_articles.json
          git diff --staged --quiet || git commit -m "Update articles $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
